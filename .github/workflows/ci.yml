name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Verify binary works
        run: |
          go build -o clawdepl .
          ./clawdepl --version

  test-npm:
    name: Test npm Package
    runs-on: ubuntu-latest
    needs: test-go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Go binary
        run: go build -o clawdepl .

      - name: Copy binary to npm package
        run: cp clawdepl npm/bin/

      - name: Test npm wrapper
        run: |
          cd npm
          node bin/clawdepl.js --version

      - name: Test npx execution
        run: |
          cd npm
          npm pack
          npx ./clawdepl-*.tgz --version

  test-python:
    name: Test Python Package
    runs-on: ubuntu-latest
    needs: test-go
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build Go binary
        run: go build -o clawdepl .

      - name: Copy binary to Python package
        run: cp clawdepl python/clawdepl/

      - name: Install Python package
        run: |
          cd python
          pip install -e .

      - name: Test Python wrapper
        run: |
          cd python
          python -m clawdepl.cli --version

      - name: Test clawdepl command
        run: clawdepl --version

  test-cross-platform:
    name: Cross-platform Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -o clawdepl${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

      - name: Test
        run: ./clawdepl${{ matrix.os == 'windows-latest' && '.exe' || '' }} --version

  test-e2e-integration:
    name: E2E Integration
    runs-on: ubuntu-latest
    needs: test-go
    timeout-minutes: 30
    if: ${{ secrets.CLAWDEPL_E2E_TOKEN != '' && secrets.CLAWDEPL_E2E_ANTHROPIC_KEY != '' && secrets.CLAWDEPL_E2E_INVALID_ANTHROPIC_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binary
        run: go build -o clawdepl .

      - name: Run E2E integration tests
        env:
          CLAWDEPL_E2E_TOKEN: ${{ secrets.CLAWDEPL_E2E_TOKEN }}
          CLAWDEPL_E2E_ANTHROPIC_KEY: ${{ secrets.CLAWDEPL_E2E_ANTHROPIC_KEY }}
          CLAWDEPL_E2E_INVALID_ANTHROPIC_KEY: ${{ secrets.CLAWDEPL_E2E_INVALID_ANTHROPIC_KEY }}
        run: ./scripts/test-e2e.sh
