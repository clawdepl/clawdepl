name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Verify binary works
        run: |
          go build -o clawdpl .
          ./clawdpl --version

  test-npm:
    name: Test npm Package
    runs-on: ubuntu-latest
    needs: test-go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Go binary
        run: go build -o clawdpl .

      - name: Copy binary to npm package
        run: cp clawdpl npm/bin/

      - name: Test npm wrapper
        run: |
          cd npm
          node bin/clawdpl.js --version

      - name: Test npx execution
        run: |
          cd npm
          npm pack
          npx ./clawdpl-*.tgz --version

  test-python:
    name: Test Python Package
    runs-on: ubuntu-latest
    needs: test-go
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build Go binary
        run: go build -o clawdpl .

      - name: Copy binary to Python package
        run: cp clawdpl python/clawdpl/

      - name: Install Python package
        run: |
          cd python
          pip install -e .

      - name: Test Python wrapper
        run: |
          cd python
          python -m clawdpl.cli --version

      - name: Test clawdpl command
        run: clawdpl --version

  test-cross-platform:
    name: Cross-platform Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build
        run: go build -o clawdpl${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

      - name: Test
        run: ./clawdpl${{ matrix.os == 'windows-latest' && '.exe' || '' }} --version
