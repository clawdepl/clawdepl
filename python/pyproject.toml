[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "create-claw-app"
version = "0.1.0"
description = "Create and manage OpenClaw AI Agent orchestrator instances"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Moltyverse", email = "hello@moltyverse.com" }
]
keywords = [
    "openclaw",
    "ai",
    "agents",
    "orchestrator",
    "cli",
    "moltyverse"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
create-claw-app = "create_claw_app.cli:main"

[project.urls]
Homepage = "https://github.com/moltyverse/create-claw-app"
Documentation = "https://github.com/moltyverse/create-claw-app#readme"
Repository = "https://github.com/moltyverse/create-claw-app.git"
Issues = "https://github.com/moltyverse/create-claw-app/issues"

[tool.hatch.build.targets.wheel]
packages = ["create_claw_app"]
