[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawdepl"
version = "0.1.0"
description = "Create and manage OpenClaw AI Agent orchestrator instances"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Moltyverse", email = "hello@moltyverse.com" }
]
keywords = [
    "openclaw",
    "ai",
    "agents",
    "orchestrator",
    "cli",
    "moltyverse",
    "clawdepl"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.scripts]
clawdepl = "clawdepl.cli:main"

[project.urls]
Homepage = "https://github.com/moltyverse/clawdepl"
Documentation = "https://github.com/moltyverse/clawdepl#readme"
Repository = "https://github.com/moltyverse/clawdepl.git"
Issues = "https://github.com/moltyverse/clawdepl/issues"

[tool.hatch.build.targets.wheel]
packages = ["clawdepl"]

[tool.hatch.build.targets.sdist]
include = [
    "/clawdepl",
    "/README.md",
    "/LICENSE",
]
