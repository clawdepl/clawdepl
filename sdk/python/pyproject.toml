[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawdepl-sdk"
version = "0.1.0"
description = "Python SDK for the clawdepl API"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clawdepl_sdk"]

[tool.mypy]
strict = true
python_version = "3.9"
